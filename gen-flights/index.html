<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* Hide the site nav only inside the /v2 window. A top-level visit keeps it. */
    (function () {
      var framed = false;
      try { framed = window.self !== window.top; } catch (err) { framed = true; }
      if (framed && new URLSearchParams(location.search).get("embed") === "v2") {
        document.documentElement.classList.add("is-embed");
      }
    })();
  </script>
  <meta name="referrer" content="no-referrer">
  <title>Gen Flights — BOOMBIBU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site-nav.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-dark: #0D0D0D;
      --bg-card: #1A1A1A;
      --accent-nav: #F03551;
      --bg-page: #1a2332;
      --bg-dots: rgba(255, 255, 255, 0.06);
      --accent: #E53935;
      --accent-dark: #C62828;
      --text-dark: #1a1a1a;
      --text-muted: #6b7280;
      --cream: #fff5f5;
      --card-white: #ffffff;
      --qr-bg: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-page);
      background-image: radial-gradient(var(--bg-dots) 1px, transparent 1px);
      background-size: 14px 14px;
      color: #fff;
    }

    .site-header .nav-links a.active {
      box-shadow: none;
    }

    html {
      scroll-padding-top: 88px;
      color-scheme: dark;
    }

    ::selection {
      background: rgba(240, 53, 81, 0.38);
      color: #fff;
    }

    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px 48px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 32px;
      align-items: start;
      min-width: 0;
    }

    .layout.is-locked .workspace {
      filter: blur(7px) brightness(0.58);
      opacity: 0.78;
      pointer-events: none;
      user-select: none;
    }

    .workspace-placeholder {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 32px;
      align-items: start;
      pointer-events: none;
      user-select: none;
    }

    #flightMount {
      display: contents;
    }

    .ph-title,
    .ph-line,
    .ph-field,
    .ph-button {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .ph-title { height: 18px; width: 46%; margin-bottom: 14px; }
    .ph-line { height: 12px; width: 72%; margin: 0 0 18px; }
    .ph-field { height: 42px; }
    .ph-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ph-stack { display: grid; gap: 12px; }
    .ph-button {
      height: 48px;
      margin-top: 8px;
      background: rgba(196, 38, 61, 0.55);
    }

    .placeholder-pass .ph-bar {
      height: 14px;
      width: 38%;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .placeholder-pass .ph-code {
      height: 28px;
      width: 64px;
      border-radius: 8px;
      background: rgba(229, 57, 53, 0.18);
    }

    @media (max-width: 900px) {
      .workspace,
      .workspace-placeholder {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .layout {
        padding: 84px 20px 32px;
      }
    }

    @media (max-width: 420px) {
      .layout {
        padding: 78px 16px 28px;
      }
    }

    .panel {
      background: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 22px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 16px;
      overflow: visible;
      color: rgba(255, 255, 255, 0.95);
    }

    .panel-note {
      font-size: 0.95rem;
      color: #c5cad3;
      margin: -8px 0 14px;
      line-height: 1.5;
    }

    .panel-note strong { color: #f6f7f9; }

    /* Group headings only show in the /v2 window's grouped layout. */
    .group-title { display: none; }

    .auth-app-icon { display: none; }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #c5cad3;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #121212;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .field input:focus {
      outline: 2px solid #F03551;
      outline-offset: 2px;
      border-color: #F03551;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-gen {
      width: 100%;
      margin-top: 8px;
      min-height: 48px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #C4263D;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .btn-gen:hover {
      background: #a81f34;
    }

    .btn-gen:focus-visible {
      outline: 2px solid #F03551;
      outline-offset: 3px;
    }

    .btn-gen:disabled,
    .btn-gen:disabled:hover {
      background: var(--accent);
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .auth-layer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 88px 20px 32px;
      pointer-events: none;
    }

    .layout.is-locked .auth-layer {
      display: flex;
      overflow: visible;
    }

    .layout:not(.is-locked) .auth-layer {
      position: static;
      display: block;
      order: -1;
      padding: 0;
      margin: 0 0 16px;
      pointer-events: none;
    }

    .layout[data-auth-state="ready"] .auth-layer {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .auth-card {
      width: min(440px, 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      padding: 36px 36px 32px;
      border-radius: 16px;
      background: #1b1b22;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
      color: #f6f7f9;
      pointer-events: auto;
      text-align: left;
      overflow: visible;
    }

    .auth-copy {
      overflow: visible;
    }

    .layout:not(.is-locked) .auth-card {
      width: 100%;
      min-height: 0;
      padding: 12px 16px;
      gap: 0;
      border-radius: 12px;
      background: #1c1c22;
      box-shadow: none;
    }

    .layout:not(.is-locked) #authHeading,
    .layout:not(.is-locked) .auth-skeleton,
    .layout:not(.is-locked) .auth-actions {
      display: none;
    }

    .auth-card h1 {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: clamp(1.1rem, 0.95rem + 0.6vw, 1.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.5;
      padding-bottom: 0.15em;
      margin: 0 0 12px;
      overflow: visible;
      background-clip: border-box;
      -webkit-background-clip: border-box;
      -webkit-text-fill-color: currentColor;
    }

    .auth-bar p,
    #authStatus {
      font-size: 1.0625rem;
      line-height: 1.5;
      color: #d5d8e0;
      max-width: 38ch;
    }

    .layout[data-auth-state="forbidden"] #authStatus,
    .layout[data-auth-state="expired"] #authStatus,
    .layout[data-auth-state="error"] #authStatus,
    .layout[data-auth-state="unconfigured"] #authStatus,
    .layout[data-auth-state="error-retry"] #authStatus,
    .layout[data-auth-state="invalid-input"] #authStatus {
      color: #ffd5dc;
    }

    .auth-skeleton {
      display: none;
      gap: 12px;
    }

    .layout[data-auth-state="loading"] .auth-skeleton,
    .layout[data-auth-phase="returning"] .auth-skeleton {
      display: grid;
    }

    .layout[data-auth-state="loading"] #authHeading,
    .layout[data-auth-phase="returning"] #authHeading,
    .layout[data-auth-state="loading"] .auth-actions,
    .layout[data-auth-phase="returning"] .auth-actions,
    .layout[data-auth-state="loading"]:not([data-auth-phase="returning"]) #authStatus {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .sk {
      display: block;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .sk-title { height: 28px; width: 78%; }
    .sk-line { width: 100%; }
    .sk-short { width: 62%; }
    .sk-btn { height: 48px; width: 100%; border-radius: 12px; margin-top: 8px; }

    .layout[data-auth-state="loading"] .sk,
    .layout[data-auth-phase="returning"] .sk {
      animation: auth-pulse 1.4s ease-in-out infinite;
    }

    .auth-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }

    .layout.is-locked .auth-actions {
      justify-content: center;
    }

    .btn-auth {
      border: none;
      border-radius: 12px;
      min-height: 48px;
      padding: 12px 18px;
      background: #F03551;
      color: #1a0a10;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .btn-github {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f4f5f7;
      color: #16181d;
    }

    .btn-github:hover {
      background: #e6e8ec;
    }

    .btn-github[aria-busy="true"] {
      cursor: progress;
    }

    .btn-github[aria-busy="true"] .github-mark {
      visibility: hidden;
      width: 0;
    }

    .btn-github[aria-busy="true"]::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(22, 24, 29, 0.25);
      border-top-color: #16181d;
      animation: auth-spin 0.7s linear infinite;
    }

    .btn-auth:focus-visible,
    .account-chip:focus-visible,
    .btn-gen:focus-visible {
      outline: 2px solid #F03551;
      outline-offset: 3px;
    }

    .btn-auth-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #f6f7f9;
      text-align: left;
    }

    .btn-auth-secondary:hover {
      background: rgba(240, 53, 81, 0.14);
      border-color: rgba(240, 53, 81, 0.55);
    }

    .account-menu {
      position: relative;
      order: -2;
      align-self: flex-end;
      z-index: 50;
      margin: 0 0 16px;
    }

    .account-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      max-width: min(280px, calc(100vw - 32px));
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #1c1c22;
      color: #f6f7f9;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .account-chip:hover,
    .account-chip[aria-expanded="true"] {
      background: #26262e;
      border-color: rgba(255, 255, 255, 0.28);
    }

    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #111114;
      color: #f6f7f9;
      flex: 0 0 auto;
    }

    .account-avatar img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      display: block;
    }

    .account-avatar:has(img:not([hidden])) .account-fallback {
      display: none;
    }

    #authUser {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-chevron {
      flex: 0 0 auto;
      opacity: 0.8;
    }

    .account-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 200px;
      padding: 6px;
      border-radius: 14px;
      background: #1c1c22;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    @keyframes auth-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @keyframes auth-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .auth-card {
        padding: 28px 22px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sk,
      .btn-github[aria-busy="true"]::before,
      .btn-gen,
      .btn-auth,
      .account-chip {
        animation: none;
        transition: none;
      }
    }

    /* —— Boarding pass —— */
    .bp-wrap {
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    .bp-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-white);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .bp-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 10px;
      background: var(--card-white);
      border-radius: 16px 16px 0 0;
    }

    .bp-back {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .bp-back svg {
      width: 20px;
      height: 20px;
    }

    .bp-brand {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 28px;
    }

    .bp-brand img {
      height: 24px;
      width: auto;
      max-width: 132px;
      object-fit: contain;
    }

    .bp-brand-fallback {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: #e2002b;
      letter-spacing: 0.02em;
    }

    .bp-status {
      margin: 0 12px 12px;
      padding: 12px 14px;
      background: var(--cream);
      border-radius: 12px;
    }

    .bp-status-text .small {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .bp-status-text .big {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: 0.02em;
      margin-top: 4px;
      line-height: 1.2;
    }

    .bp-main {
      margin: 0 12px 12px;
      padding: 18px 16px 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      color: var(--text-dark);
    }

    .bp-main-row1 {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .bp-main-row1 .lbl {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .bp-main-row1 .val {
      font-size: 0.95rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-dark);
    }

    .bp-route {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bp-route-names {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .bp-route-city-left {
      font-size: 0.8rem;
      font-weight: 800;
      color: #111827;
      line-height: 1.25;
    }

    .bp-route-city-right {
      font-size: 0.8rem;
      font-weight: 800;
      color: #111827;
      line-height: 1.25;
      text-align: right;
    }

    .bp-route-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #9ca3af;
      line-height: 1.35;
    }

    .bp-route-detail-left { text-align: left; }
    .bp-route-detail-right { text-align: right; }

    .bp-route-iat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 4px;
    }

    .bp-route-iat .iat-code {
      flex: 1;
      min-width: 0;
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .bp-route-iat .iat-code--left { text-align: left; }
    .bp-route-iat .iat-code--right { text-align: right; }

    .bp-route-plane {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      padding: 0 4px;
    }

    .bp-route-plane svg {
      width: 26px;
      height: 26px;
      display: block;
      transform: rotate(90deg);
    }

    .bp-white {
      padding: 4px 16px 12px;
      background: var(--card-white);
    }

    .bp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 10px;
    }

    .bp-cell .lbl {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .bp-cell .val {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .bp-cell .val.boarding {
      color: var(--accent);
    }

    .bp-qr-block {
      margin: 14px 12px 16px;
      padding: 16px;
      background: var(--qr-bg);
      border-radius: 12px;
      text-align: center;
    }

    .bp-card > .bp-qr-block:last-child {
      border-radius: 0 0 14px 14px;
      margin-bottom: 0;
    }

    #qrcode {
      display: inline-block;
      margin: 0 auto 12px;
    }

    #qrcode img {
      display: block;
      margin: 0 auto;
    }

    .bp-ref {
      font-size: 0.85rem;
      font-weight: 700;
      color: #374151;
      letter-spacing: 0.04em;
    }

    .bp-hint {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 8px;
    }

    html.is-embed .site-header { display: none; }
    html.is-embed { scroll-padding-top: 0; }
    html.is-embed .layout { padding-top: 24px; }
    html.is-embed .auth-layer { padding-top: 24px; }

    /* —— Inside the /v2 window: a light macOS look, in the style of System Settings and its alerts —— */
    html.is-embed {
      color-scheme: light;
      --bg-page: #F5F5F7;
      --text-muted: #6E6E73;
      --mac-blue: #0A7AFF;
      --mac-ring: rgba(10, 122, 255, 0.45);
      --mac-line: rgba(0, 0, 0, 0.08);
    }

    html.is-embed body {
      background: var(--bg-page);
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* The form and auth chrome take the window's system font; the boarding pass keeps its own type. */
    html.is-embed .auth-card h1 { font-family: inherit; }
    html.is-embed .bp-card { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

    html.is-embed ::selection { background: rgba(10, 122, 255, 0.22); color: inherit; }

    html.is-embed .layout { padding: 22px 28px 32px; }

    html.is-embed .workspace,
    html.is-embed .workspace-placeholder {
      grid-template-columns: minmax(300px, 420px) 1fr;
      gap: 28px;
    }

    @media (max-width: 900px) {
      html.is-embed .workspace,
      html.is-embed .workspace-placeholder { grid-template-columns: 1fr; }
    }

    html.is-embed .layout.is-locked .workspace {
      filter: blur(5px);
      opacity: 0.5;
    }

    /* Grouped form */
    html.is-embed #flightMount .panel {
      background: none;
      border: 0;
      box-shadow: none;
      padding: 0;
