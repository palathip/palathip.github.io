# Requires the repository secret GIST_TOKEN: a classic PAT with the gist scope.
name: Sync resume gist

on:
  push:
    branches:
      - master
    paths:
      - resume.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gist resume.json
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          test -n "$GIST_TOKEN"
          jq -n --rawfile content resume.json '{files:{"resume.json":{content:$content}}}' \
            | curl -sS --fail-with-body -X PATCH \
                -H "Authorization: Bearer ${GIST_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/gists/0b87085436543587441ecafe0a0be7e2 \
                --data-binary @-
